<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Kaggriculture</title>
  <desc id="description">A sunrise over geometric farm rows beside the Kaggriculture wordmark.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071f33"/>
      <stop offset="0.58" stop-color="#0d4c5e"/>
      <stop offset="1" stop-color="#167768"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9be15d"/>
      <stop offset="1" stop-color="#2ab673"/>
    </linearGradient>
    <linearGradient id="crop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdb70"/>
      <stop offset="1" stop-color="#f08a36"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#03111b" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="34" fill="url(#sky)"/>
  <circle cx="205" cy="104" r="58" fill="#ffd45e" opacity=".98"/>
  <circle cx="205" cy="104" r="82" fill="none" stroke="#ffd45e" stroke-width="2" opacity=".28"/>

  <g filter="url(#shadow)">
    <path d="M55 290 210 160 365 290Z" fill="#103f46"/>
    <path d="M75 301 210 181 345 301Z" fill="url(#field)"/>
    <path d="M210 181 210 301" stroke="#d7f8a4" stroke-width="5" opacity=".7"/>
    <path d="M171 216 249 216M132 250 288 250M94 285 326 285" stroke="#0f785b" stroke-width="8" stroke-linecap="round"/>
    <path d="M210 181 75 301M210 181 345 301" fill="none" stroke="#bce984" stroke-width="4" opacity=".65"/>
  </g>

  <g transform="translate(180 115)">
    <path d="M25 71c-1-35 8-56 28-70 3 28-5 52-28 70Z" fill="#65d873"/>
    <path d="M24 69C5 47-2 25 4 3c24 16 31 38 20 66Z" fill="#8ee26e"/>
    <path d="M27 70c17-25 35-38 54-38-6 27-24 42-54 38Z" fill="#4ebd6d"/>
    <path d="M26 62c23 24 25 58 5 101-22-38-24-72-5-101Z" fill="url(#crop)"/>
  </g>

  <g fill="#ffffff">
    <text x="425" y="163" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="78" font-weight="800" letter-spacing="-3">Kaggriculture</text>
    <text x="430" y="218" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="500" letter-spacing="5" opacity=".78">AUTONOMOUS FARMING AGENT</text>
  </g>

  <g transform="translate(430 258)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">
    <rect width="168" height="42" rx="21" fill="#ffffff" opacity=".12"/>
    <circle cx="24" cy="21" r="7" fill="#7bed9f"/>
    <text x="42" y="27" fill="#eafff5">Deterministic</text>
    <rect x="184" width="180" height="42" rx="21" fill="#ffffff" opacity=".12"/>
    <path d="M207 27V15l11-6 11 6v12l-11 6Z" fill="none" stroke="#ffd45e" stroke-width="3"/>
    <text x="241" y="27" fill="#fff6d6">720 states</text>
  </g>
</svg>
